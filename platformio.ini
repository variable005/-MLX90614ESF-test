[platformio]
src_dir = firmware

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    links2004/WebSockets@^2.4.1
    adafruit/Adafruit MLX90614 Library@^2.1.6

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    links2004/WebSockets@^2.4.1
    adafruit/Adafruit MLX90614 Library@^2.1.6
